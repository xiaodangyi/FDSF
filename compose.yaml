name: ${COMPOSE_PROJECT_NAME:-deskvision-s6}

x-app: &app
  image: ${DESKVISION_IMAGE:-deskvision:s6}
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=256m,mode=1777"]
  environment: &environment
    DESKVISION_REDIS_URL: redis://redis:6379/0
    DESKVISION_AUTH_CONFIG: /run/secrets/auth
    DESKVISION_LOCAL_HTTP: "true"
  volumes:
    - runs:/app/runs
    - type: bind
      source: ${YOLO_WEIGHTS:?Run the S6 preparation command}
      target: /app/models/yolov8n.pt
      read_only: true
    - type: bind
      source: ${FINETUNED_WEIGHTS:?Run the S6 preparation command}
      target: /app/models/best.pt
      read_only: true
    - type: bind
      source: ${SAM2_WEIGHTS:?Run the S6 preparation command}
      target: /app/models/sam2.1_hiera_tiny.pt
      read_only: true
    - type: bind
      source: ${PRIVATE_DIR:-./.local/s6}/config.json
      target: /app/.local/config.json
      read_only: true
  secrets: [auth]

services:
  web:
    <<: *app
    command: [web]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /app/environment/container_entrypoint.py, health-web]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  worker:
    <<: *app
    command: [worker]
    environment:
      <<: *environment
      DESKVISION_DEEPSEEK_SECRET: /run/secrets/deepseek
    secrets: [auth, deepseek]
    depends_on:
      redis: {condition: service_healthy}
    stop_grace_period: 32m
    healthcheck:
      test: [CMD, python, /app/environment/container_entrypoint.py, health-worker]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  bootstrap:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: [bootstrap]
    secrets: [auth, accounts]

  redis:
    image: redis:8.0.5-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec,
              --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8001}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  runs:
  redis:

secrets:
  auth:
    file: ${PRIVATE_DIR:-./.local/s6}/auth.json
  deepseek:
    file: ${PRIVATE_DIR:-./.local/s6}/deepseek.env
  accounts:
    file: ${PRIVATE_DIR:-./.local/s6}/accounts.json
