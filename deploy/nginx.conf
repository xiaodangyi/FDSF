# Local demonstration only. S7 adds a public HTTPS entrypoint.
server {
    listen 8080;
    server_name _;
    client_max_body_size 34m;
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Port is published on the Docker host loopback only. Replace, never append,
        # caller-supplied proxy headers; this local gateway represents loopback.
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
    }
}
